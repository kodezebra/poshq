name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify version and checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install JavaScript dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Check frontend types
        working-directory: desktop
        run: bun run check

      - name: Run frontend tests
        working-directory: desktop
        run: bunx vitest run

      - name: Check Rust formatting
        working-directory: desktop/src-tauri
        run: cargo fmt --all -- --check

      - name: Lint Rust
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust tests
        working-directory: desktop/src-tauri
        run: cargo test

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          tauri_version="$(jq -r .version desktop/src-tauri/tauri.conf.json)"
          package_version="$(jq -r .version desktop/package.json)"

          if [ "$tag" != "$tauri_version" ] || [ "$tag" != "$package_version" ]; then
            echo "Tag v$tag does not match tauri.conf.json ($tauri_version) and package.json ($package_version)." >&2
            exit 1
          fi

  build-linux:
    name: Linux installers
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            rpm \
            wget

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install JavaScript dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName: Posh ${{ github.ref_name }}
          releaseBody: |
            Unsigned Posh installers for ${{ github.ref_name }}.

            Download the asset for your platform: `.deb`, `.rpm` or
            `.AppImage` on Linux; `.msi` or the NSIS `.exe` on Windows.
            These builds are not code-signed.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
          args: --bundles deb,rpm,appimage

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: posh-linux-${{ github.sha }}
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Windows installers
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install JavaScript dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName: Posh ${{ github.ref_name }}
          releaseBody: |
            Unsigned Posh installers for ${{ github.ref_name }}.

            Download the asset for your platform: `.deb`, `.rpm` or
            `.AppImage` on Linux; `.msi` or the NSIS `.exe` on Windows.
            These builds are not code-signed.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: posh-windows-${{ github.sha }}
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
